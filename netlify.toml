[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 1. Admin qovluğunu və daxilindəki faylları olduğu kimi saxla
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200

# 2. Əgər admin daxilində səhifə tapılmazsa, ana index.html-ə yönləndir (SPA routing)
[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

# 3. BÜTÜN DİGƏR sorğuları (ana səhifə daxil) yeni sayta yönləndir
[[redirects]]
  from = "https://murad-maharramli.netlify.app/*"
  to = "https://muradmaharramli.me/:splat"
  status = 301
  force = true