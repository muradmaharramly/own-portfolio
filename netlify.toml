[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://murad-maharramli.netlify.app/*"
  to = "https://muradmaharramli.me/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://murad-maharramli.netlify.app/*"
  to = "https://muradmaharramli.me/:splat"
  status = 301
  force = true